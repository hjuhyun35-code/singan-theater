name: 초안 만들기

on:
  workflow_dispatch:
    inputs:
      count:
        description: "몇 건 만들지 (비우면 config.json 의 하루_초안수)"
        required: false
        default: ""
  schedule:
    # 매일 아침 8시(한국). 초안만 만들고 발행은 하지 않습니다.
    - cron: "47 22 * * *"

permissions:
  contents: write

# 감시자가 둘 이상 돌면 서로 버튼 눌림을 가져가 버립니다.
# 새로 시작한 쪽이 이어받고 이전 것은 멈춥니다. (밀린 눌림은 새 감시자가 그대로 받습니다)
concurrency:
  group: telegram-watch
  cancel-in-progress: true

jobs:
  draft:
    runs-on: ubuntu-latest
    # 감시 단계를 뺐으니 40분이면 넉넉합니다 (예전에는 5시간 반을 기다렸습니다).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 한글 폰트와 ffmpeg 설치
        # 폰트가 없으면 한글이 전부 네모(□)로 나옵니다.
        # ffmpeg 는 GitHub 서버에 없습니다. 릴스를 만들려면 깔아야 합니다.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji ffmpeg
          fc-cache -f

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 초안 생성
        id: gen
        env:
          ALADIN_TTB_KEY: ${{ secrets.ALADIN_TTB_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 없으면 국중 보강만 조용히 건너뜁니다
          NL_API_KEY: ${{ secrets.NL_API_KEY }}
          DRAFT_COUNT: ${{ inputs.count }}
        run: python scripts/generate.py

      - name: 결과 커밋
        if: steps.gen.outputs.count != '0'
        run: |
          git config user.name "book-bot"
          git config user.email "book-bot@users.noreply.github.com"
          git add posts
          git diff --staged --quiet || git commit -m "초안 ${{ steps.gen.outputs.slugs }}"
          # 봇이 도는 동안 사람이 저장소에 뭔가 올리면 push 가 거부됩니다.
          # 그러면 초안은 다 만들어놓고 텔레그램 알림만 안 가고 끝납니다 (2026-08-05 실제로 겪음).
          # 원격 것을 받아 얹은 뒤 다시 시도합니다.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push 거부됨 ($i/3). 원격 변경을 받아 다시 시도합니다."
            git pull --rebase --autostash -q origin main || true
            sleep 5
          done
          git push

      - name: 텔레그램으로 보내기
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLUGS: ${{ steps.gen.outputs.slugs }}
        run: python scripts/notify.py

      - name: 릴스 만들어 보내기
        # 카드뉴스보다 릴스가 훨씬 많이 퍼져서, 매일 영상까지 만들어 보냅니다.
        # 초안 하나가 실패해도 나머지는 계속합니다. 영상 하나 없다고 전체를 죽일 이유가 없습니다.
        if: steps.gen.outputs.count != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLUGS: ${{ steps.gen.outputs.slugs }}
        run: |
          # 몇 개를 만들지는 config.json 의 영상.하루_개수 가 정합니다.
          # 초안 번호를 콕 집지 않고 맡기면, 아직 안 쓴 책 중 후기 많은 순으로 고릅니다.
          # 오늘 만든 초안이 그 안에 들어 있고, 남은 옛 초안도 같이 후보가 됩니다.
          N=$(python -c "import json;print(json.load(open('config.json',encoding='utf-8'))['영상'].get('하루_개수',1))")
          echo "오늘 만들 릴스: ${N}개"
          REEL_COUNT="$N" python scripts/make_reel.py

      - name: 만든 것 미리보기 (Actions 화면에서도 볼 수 있게)
        if: steps.gen.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: cards
          path: |
            posts/**/card*.jpg
            posts/**/reel.mp4
          retention-days: 14
          if-no-files-found: ignore

      # 2026-08-07 '버튼 기다리기' 단계를 뺐습니다.
      #
      # 이제 텔레그램이 버튼 눌림을 웹훅으로 즉시 보냅니다(worker/ 참고).
      # 웹훅이 걸려 있으면 텔레그램은 getUpdates 를 409 로 거부하므로,
      # 이 단계를 남겨두면 초안은 잘 만들어놓고 마지막에 빨간 실패로 끝납니다.
      #
      # 되돌리려면: '텔레그램 연결' 워크플로를 mode=off 로 돌리고,
      # 이 단계와 '버튼 확인' 의 schedule 을 함께 되살리세요.
