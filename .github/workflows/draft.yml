name: 초안 만들기

on:
  workflow_dispatch:
    inputs:
      count:
        description: "몇 건 만들지 (비우면 config.json 의 하루_초안수)"
        required: false
        default: ""
  schedule:
    # 매일 아침 8시(한국). 초안만 만들고 발행은 하지 않습니다.
    - cron: "0 23 * * *"

permissions:
  contents: write

# 감시자가 둘 이상 돌면 서로 버튼 눌림을 가져가 버립니다.
# 새로 시작한 쪽이 이어받고 이전 것은 멈춥니다. (밀린 눌림은 새 감시자가 그대로 받습니다)
concurrency:
  group: telegram-watch
  cancel-in-progress: true

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 한글 폰트 설치
        # 이게 없으면 카드의 한글이 전부 네모(□)로 나옵니다
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji
          fc-cache -f

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 초안 생성
        id: gen
        env:
          ALADIN_TTB_KEY: ${{ secrets.ALADIN_TTB_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 없으면 국중 보강만 조용히 건너뜁니다
          NL_API_KEY: ${{ secrets.NL_API_KEY }}
          DRAFT_COUNT: ${{ inputs.count }}
        run: python scripts/generate.py

      - name: 결과 커밋
        if: steps.gen.outputs.count != '0'
        run: |
          git config user.name "book-bot"
          git config user.email "book-bot@users.noreply.github.com"
          git add posts
          git diff --staged --quiet || git commit -m "초안 ${{ steps.gen.outputs.slugs }}"
          git push

      - name: 텔레그램으로 보내기
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLUGS: ${{ steps.gen.outputs.slugs }}
        run: python scripts/notify.py

      - name: 카드 미리보기 (Actions 화면에서도 볼 수 있게)
        if: steps.gen.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: cards
          path: posts/**/card*.jpg
          retention-days: 14

      - name: 버튼 기다리기
        # 텔레그램에서 '승인하고 올리기' 를 누르면 여기서 바로 발행합니다.
        # 아침 8시 알림 후 오후 1시 반까지 지켜봅니다.
        # 그보다 늦게 누른 것은 '버튼 확인' 워크플로를 한 번 돌리면 처리됩니다.
        if: steps.gen.outputs.count != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # 전용 봇이 맞는지 확인하는 안전장치. 다르면 감시하지 않습니다.
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          WATCH_MINUTES: "330"
        run: python scripts/watch_buttons.py
