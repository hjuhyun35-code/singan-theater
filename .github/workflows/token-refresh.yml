name: 토큰 점검

# 인스타·쓰레드 토큰은 60일이면 만료되고, 만료되면 발행이 조용히 멈춥니다.
# 매주 확인해서 죽으면 텔레그램으로 알려줍니다. 아무것도 발행하지 않습니다.
#
# GH_PAT(Secrets 쓰기 권한)를 넣어두면 확인에 그치지 않고 60일 연장까지 자동으로 합니다.
# 없어도 '조용히 멈추는 것'은 막아줍니다.

on:
  workflow_dispatch:
  schedule:
    # 매주 월요일 오전 9시(한국)
    - cron: "0 0 * * 1"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 토큰 점검
        env:
          # 비어 있으면 '확인만' 모드로 돕니다. 넣으면 자동 연장까지 합니다.
          GH_TOKEN: ${{ secrets.GH_PAT }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/refresh_token.py
