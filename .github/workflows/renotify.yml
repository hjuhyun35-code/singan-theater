name: 알림 다시 보내기

# 이미 만들어진 초안을 텔레그램으로 다시 보냅니다.
# 알림을 놓쳤거나, 봇을 바꿔서 예전 버튼이 안 먹을 때 씁니다.
# 보낸 뒤 버튼을 지켜보므로 그 자리에서 바로 발행할 수 있습니다.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "다시 보낼 초안 번호 (예: 20260804-3)"
        required: true
      minutes:
        description: "보낸 뒤 몇 분 동안 버튼을 지켜볼지 (기본 60)"
        required: false
        default: "60"

permissions:
  contents: write

concurrency:
  group: telegram-watch
  cancel-in-progress: true

jobs:
  renotify:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 다시 보내기
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLUGS: ${{ inputs.slug }}
        run: python scripts/notify.py

      - name: 버튼 기다리기
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          WATCH_MINUTES: ${{ inputs.minutes }}
        run: python scripts/watch_buttons.py
