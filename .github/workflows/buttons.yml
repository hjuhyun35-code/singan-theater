name: 버튼 확인

# 텔레그램에서 누른 '승인하고 올리기' 를 처리합니다.
#
# 초안이 만들어진 직후 30분은 자동으로 지켜보고 있습니다.
# 그 시간이 지나서 누르셨다면 이걸 한 번 돌리세요.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "몇 분 동안 지켜볼지 (기본 10)"
        required: false
        default: "10"

permissions:
  contents: write

# 초안 워크플로의 감시자와 겹치지 않게 합니다. 이걸 돌리면 그쪽 감시는 멈추고
# 밀려 있던 버튼 눌림을 이쪽이 받아 처리합니다.
concurrency:
  group: telegram-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 버튼 처리
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          WATCH_MINUTES: ${{ inputs.minutes }}
        run: python scripts/watch_buttons.py
