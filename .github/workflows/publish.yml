name: 발행하기

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "발행할 초안 번호 (예: 20260802-1). 텔레그램 메시지에 적혀 있습니다"
        required: true
      confirm:
        description: "정말 올리려면 PUBLISH 라고 정확히 입력. 다르면 예행연습만 합니다"
        required: true
        default: "예행연습"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 발행
        env:
          SLUG: ${{ inputs.slug }}
          CONFIRM: ${{ inputs.confirm }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python scripts/publish.py

      - name: 발행 기록 커밋
        if: ${{ inputs.confirm == 'PUBLISH' }}
        run: |
          git config user.name "book-bot"
          git config user.email "book-bot@users.noreply.github.com"
          git add posts
          git diff --staged --quiet || git commit -m "발행 ${{ inputs.slug }}"
          # 같은 시각에 다른 것이 저장소에 올라오면 push 가 거부됩니다.
          # 인스타에는 이미 올라간 뒤라, 여기서 실패하면 '올림' 기록만 사라집니다.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push 거부됨 ($i/3). 원격 변경을 받아 다시 시도합니다."
            git pull --rebase --autostash -q origin main || true
            sleep 5
          done
          git push
