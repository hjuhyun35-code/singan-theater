name: 텔레그램 연결

# 텔레그램에게 "이제 버튼 눌림을 이 주소로 보내라" 고 알려줍니다.
# 봇 열쇠가 GitHub Secrets 밖으로 나가지 않게, 이 일은 여기서 합니다.
#
# ★ on 을 켜면 물어보는 방식('버튼 확인', 초안의 '버튼 기다리기')은 죽습니다.
#   텔레그램은 웹훅과 getUpdates 둘 중 하나만 허용합니다.
#   되돌리려면 mode 를 off 로 두고 한 번 더 돌리세요.
#
# ※ 입력 이름은 반드시 영문이어야 합니다. 한글로 뒀더니 GitHub 이
#   워크플로 파일 자체를 거부했습니다 (2026-08-07).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "status=상태확인 / on=연결 / off=해제"
        required: true
        default: "status"
        type: choice
        options: [status, "on", "off"]
      url:
        description: "on 일 때 쓸 Worker 주소 (비우면 기본값)"
        required: false
        default: ""

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 텔레그램에 알리기
        env:
          T: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          S: ${{ secrets.WEBHOOK_SECRET }}
          URL: ${{ inputs.url }}
          MODE: ${{ inputs.mode }}
        run: |
          set -e
          API="https://api.telegram.org/bot$T"
          if [ "$MODE" = "on" ]; then
            [ -n "$URL" ] || URL="https://singan-telegram.garii.workers.dev"
            echo "연결합니다: $URL"
            curl -sS -X POST "$API/setWebhook" \
              -d "url=$URL" \
              -d "secret_token=$S" \
              -d 'allowed_updates=["message","callback_query"]' \
              -d "drop_pending_updates=false"
            echo ""
          elif [ "$MODE" = "off" ]; then
            echo "연결을 끊습니다. 다시 물어보는 방식으로 돌아갑니다."
            curl -sS -X POST "$API/deleteWebhook"
            echo ""
          fi
          echo "── 지금 상태 ──"
          # 열쇠가 로그에 남지 않도록 필요한 항목만 골라 찍습니다.
          curl -sS "$API/getWebhookInfo" -o /tmp/i.json
          python3 -c "
          import json
          d = json.load(open('/tmp/i.json')).get('result', {})
          print('연결 주소 :', d.get('url') or '(없음 - 물어보는 방식)')
          print('밀린 눌림 :', d.get('pending_update_count', 0), '건')
          if d.get('last_error_message'):
              print('최근 오류 :', d['last_error_message'])
              print('  -> Worker 가 아직 안 떴거나 비밀값이 안 맞습니다.')
          "
