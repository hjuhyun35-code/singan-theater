name: 텔레그램 명령

# 텔레그램에서 버튼을 누르거나 "초안" 이라고 보내면 Cloudflare Worker 가
# 이 워크플로를 즉시 깨웁니다. 물어보는 방식(버튼 확인)과 달리 기다림이 없습니다.
#
# Worker 코드는 저장소의 worker/ 안에 있습니다.
# 무엇을 할지는 client_payload.action 에 담겨 옵니다: publish / skip / draft

on:
  repository_dispatch:
    types: [telegram]

permissions:
  contents: write

jobs:
  # ── 버튼을 누른 경우: 그 한 건만 처리하고 끝. 보통 1분 안에 끝납니다. ──
  button:
    # 반드시 할 일을 하나씩 적어야 합니다. '초안이 아니면' 처럼 적었더니
    # 릴스 요청에도 이 작업이 딸려 돌아 죽었습니다 (2026-08-07).
    if: >-
      github.event.client_payload.action == 'publish' ||
      github.event.client_payload.action == 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 버튼 처리
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          TG_ACTION: ${{ github.event.client_payload.action }}
          TG_SLUG: ${{ github.event.client_payload.slug }}
          TG_CHAT_ID: ${{ github.event.client_payload.chat_id }}
          TG_MESSAGE_ID: ${{ github.event.client_payload.message_id }}
        run: python scripts/tg_action.py

  # ── "릴스" 라고 보낸 경우: 이미 만든 초안으로 세로 영상을 만들어 보냅니다. ──
  # 문구를 다시 짓지 않으므로 모델 비용이 들지 않습니다.
  # 인스타에 직접 올리지 않습니다 — 앱의 음악 목록은 API 로 못 붙입니다.
  reel:
    if: github.event.client_payload.action == 'reel'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # 두 건이 동시에 돌면 같은 post.json 을 고치다 rebase 가 충돌하고,
    # 저장소가 detached HEAD 로 빠져 push 가 죽습니다 (2026-08-07 실제로 겪음).
    # 취소하지 않고 줄 세웁니다. 영상은 둘 다 나와야 합니다.
    concurrency:
      group: reel
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 한글 폰트와 ffmpeg 설치
        # ffmpeg 는 GitHub 서버에 없습니다. 직접 깔아야 합니다.
        # (2026-08-07 있는 줄 알고 안 깔았다가 ffprobe 없음으로 실패했습니다)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji ffmpeg
          fc-cache -f
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 영상 만들어 보내기
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 릴스 대본과 캡션을 쓰는 데 필요합니다. 없으면 카드 문구로 물러섭니다.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REEL_SLUG: ${{ github.event.client_payload.slug }}
          # 텔레그램에서 '고쳐: ~' 라고 적어 보낸 내용. 대본을 쓸 때 최우선으로 반영합니다.
          REEL_NOTE: ${{ github.event.client_payload.note }}
          # 한 작업 안에서 몇 개를 만들지. 요청을 여러 번 보내면 GitHub 가 줄 세우다
          # 앞의 것을 취소해 몇 개만 남습니다. 그래서 한 번에 만듭니다.
          REEL_COUNT: ${{ github.event.client_payload.count }}
        run: python scripts/make_reel.py

      - name: 만든 기록 남기기
        # post.json 에 reel_at 이 찍힙니다. 다음에 같은 책이 또 걸리지 않게 하는 표시입니다.
        # 영상 파일 자체는 .gitignore 로 빠집니다.
        run: |
          git config user.name "book-bot"
          git config user.email "book-bot@users.noreply.github.com"
          git add posts
          git diff --staged --quiet && exit 0
          git commit -m "릴스 만듦"
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push 거부됨 ($i/3). 원격 변경을 받아 다시 시도합니다."
            # 앞선 시도가 충돌로 멈춰 있으면 먼저 걷어냅니다.
            # 안 그러면 rebase 중간 상태(detached HEAD)에 갇혀 계속 실패합니다.
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash -q origin main || true
            sleep 5
          done
          # 이 표시는 다음에 같은 책이 또 걸리지 않게 하는 것뿐입니다.
          # 여기서 실패해도 영상과 캡션은 이미 갔으므로 전체를 죽이지 않습니다.
          git push origin HEAD:main || echo "표시 저장 실패. 영상은 정상으로 갔습니다."

      - name: 영상 내려받기 (텔레그램이 실패했을 때용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: posts/**/reel.mp4
          retention-days: 7
          if-no-files-found: ignore

  # ── "목록" 이라고 보낸 경우: 지금까지 뭘 만들고 올렸는지 보여줍니다. ──
  list:
    if: github.event.client_payload.action == 'list'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 기록 보내기
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/history.py

  # ── "초안" 이라고 보낸 경우: 새로 만들어 텔레그램으로 보냅니다. 10~20분. ──
  draft:
    if: github.event.client_payload.action == 'draft'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 한글 폰트와 ffmpeg 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji ffmpeg
          fc-cache -f

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 초안 생성
        id: gen
        env:
          ALADIN_TTB_KEY: ${{ secrets.ALADIN_TTB_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NL_API_KEY: ${{ secrets.NL_API_KEY }}
        run: python scripts/generate.py

      - name: 결과 커밋
        if: steps.gen.outputs.count != '0'
        run: |
          git config user.name "book-bot"
          git config user.email "book-bot@users.noreply.github.com"
          git add posts
          git diff --staged --quiet || git commit -m "초안 ${{ steps.gen.outputs.slugs }}"
          # 같은 시각에 다른 것이 올라오면 push 가 거부됩니다. 받아서 얹고 다시 시도합니다.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push 거부됨 ($i/3). 원격 변경을 받아 다시 시도합니다."
            git pull --rebase --autostash -q origin main || true
            sleep 5
          done
          git push

      - name: 텔레그램으로 보내기
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLUGS: ${{ steps.gen.outputs.slugs }}
        run: python scripts/notify.py

      - name: 릴스 만들어 보내기
        # 카드뉴스를 끈 뒤로는 이게 있어야 실제로 쓸 것이 나옵니다.
        # 하나 실패해도 나머지는 계속합니다.
        if: steps.gen.outputs.count != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLUGS: ${{ steps.gen.outputs.slugs }}
        run: |
          for s in $(echo "$SLUGS" | tr ',' ' '); do
            echo "── 릴스: $s ──"
            REEL_SLUG="$s" python scripts/make_reel.py || echo "!! 릴스 실패: $s (초안은 정상입니다)"
          done

      - name: 만든 것 미리보기
        if: steps.gen.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: cards
          path: |
            posts/**/card*.jpg
            posts/**/reel.mp4
          retention-days: 14
          if-no-files-found: ignore
