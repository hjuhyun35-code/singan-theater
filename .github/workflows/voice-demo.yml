name: 목소리 들어보기

# 릴스에 쓸 목소리를 고르려고 견본을 텔레그램으로 보냅니다.
# 마음에 드는 것을 고른 뒤 config.json 의 영상.목소리 를 그 이름으로 바꾸면 됩니다.

on:
  workflow_dispatch:
    inputs:
      gender:
        description: "여자 / 남자 / 전부"
        required: true
        default: "여자"
        type: choice
        options: ["여자", "남자", "전부"]
      multilingual:
        description: "여러 언어를 하는 목소리도 들어볼지 (한국어 목소리가 몇 개 없습니다)"
        required: false
        default: "아니오"
        type: choice
        options: ["아니오", "예"]
      text:
        description: "읽힐 문장 (비우면 기본 문장)"
        required: false
        default: ""

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install edge-tts requests

      - name: 견본 만들어 보내기
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VOICE_TEXT: ${{ inputs.text }}
        run: |
          case "${{ inputs.gender }}" in
            여자) export VOICE_GENDER=Female ;;
            남자) export VOICE_GENDER=Male ;;
            *)    export VOICE_GENDER= ;;
          esac
          if [ "${{ inputs.multilingual }}" = "예" ]; then export VOICE_MULTI=1; fi
          export VOICE_OUT="$GITHUB_WORKSPACE/voice_samples"
          python tools/voice_demo.py

      - name: 견본 파일 남기기
        # 텔레그램에서 소리가 안 들릴 때 여기서 내려받아 들을 수 있습니다.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voices
          path: voice_samples/*.mp3
          retention-days: 7
          if-no-files-found: ignore
